# AapadaOps Multi-Service Production Stack
# High-Availability Orchestration: PostgreSQL 16 + PostGIS 3.4, Redis 7, FastAPI Backend, React Nginx Frontend

version: "3.8"

services:
  # ============================================================================
  # 1. Database: PostgreSQL 16 with PostGIS 3.4 Spatial Extension
  # ============================================================================
  db:
    image: postgis/postgis:16-3.4-alpine
    container_name: aapadaops-db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aapadaops}
      POSTGRES_USER: ${POSTGRES_USER:-aapadaops_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-AapadaOpsSecurePostgres2026!}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/scripts/init_postgis.sql:/docker-entrypoint-initdb.d/init_postgis.sql:ro
    ports:
      - "${DB_PORT:-5432}:5432"
    shm_size: 256mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aapadaops_admin} -d ${POSTGRES_DB:-aapadaops}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - aapadaops-net
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # ============================================================================
  # 2. Cache & Pub/Sub: Redis 7 for Real-Time Multi-Pod WebSocket & Rate Limiting
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: aapadaops-redis
    restart: always
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-AapadaOpsRedisSecret2026!}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
    volumes:
      - redisdata:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-AapadaOpsRedisSecret2026!}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - aapadaops-net
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  # ============================================================================
  # 3. Backend: FastAPI Async Application with OR-Tools MIP & GeoAlchemy2
  # ============================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aapadaops-backend
    restart: always
    environment:
      APP_NAME: "AapadaOps"
      APP_ENV: "production"
      APP_VERSION: "1.0.0"
      DEBUG: "false"
      PORT: 8000
      SECRET_KEY: ${SECRET_KEY:-aapadaops_prod_secret_key_change_me_in_real_env_998877665544332211}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-aapadaops_admin}:${POSTGRES_PASSWORD:-AapadaOpsSecurePostgres2026!}@db:5432/${POSTGRES_DB:-aapadaops}
      DEFAULT_SRID: 4326
      REDIS_URL: redis://:${REDIS_PASSWORD:-AapadaOpsRedisSecret2026!}@redis:6379/0
      UPLOAD_DIR: "/app/uploads"
      MAX_FILE_SIZE_BYTES: 15728640
      BACKEND_CORS_ORIGINS: >-
        ["http://localhost", "http://127.0.0.1", "http://frontend", "http://localhost:5173", "https://aapadaops.osdma.gov.in"]
      DEFAULT_RATE_LIMIT_PER_MINUTE: 120
      SUBMIT_RATE_LIMIT_PER_MINUTE: 15
    volumes:
      - evidence_uploads:/app/uploads
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - aapadaops-net
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # ============================================================================
  # 4. Frontend: React Vite Application served via Hardened Nginx
  # ============================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aapadaops-frontend
    restart: always
    ports:
      - "${FRONTEND_PORT:-80}:80"
      - "${FRONTEND_SSL_PORT:-443}:443"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - aapadaops-net
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 15s
      timeout: 5s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

networks:
  aapadaops-net:
    driver: bridge
    name: aapadaops-network

volumes:
  pgdata:
    name: aapadaops-pgdata
  redisdata:
    name: aapadaops-redisdata
  evidence_uploads:
    name: aapadaops-evidence-uploads
